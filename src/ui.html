<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1e1e1e;--surface:#262626;--surface2:#313131;--border:#393939;
  --text:#e0e0e0;--muted:#737373;
  --accent:#18a0fb;
  --ok:#1bc47d;    --ok-dim:rgba(27,196,125,.1);
  --miss:#f5a623;  --miss-dim:rgba(245,166,35,.09);
  --err:#f24822;   --err-dim:rgba(242,72,34,.09);
  --r:6px;--font:'Inter',-apple-system,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:12px;line-height:1.5;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* header */
.header{padding:10px 14px 9px;border-bottom:1px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;gap:8px}
.header h1{font-size:13px;font-weight:700;flex:1}

/* selection strip */
.sel{padding:7px 14px;background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;gap:8px;min-height:36px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
.dot.on{background:var(--accent)}
.sel-name{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-sub {font-size:10px;color:var(--muted)}

/* body */
.body{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* idle */
.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:24px 20px;text-align:center;color:var(--muted)}
.idle .ico{font-size:28px;opacity:.55}
.idle .title{font-size:13px;font-weight:700;color:var(--text)}
.idle .desc{font-size:11px;line-height:1.7;max-width:220px}

/* stats strip */
.stats{display:flex;gap:1px;background:var(--border);border-bottom:1px solid var(--border);flex-shrink:0}
.stat{flex:1;background:var(--surface);padding:7px 4px;text-align:center}
.stat .val{font-size:17px;font-weight:700;line-height:1;color:var(--muted)}
.stat .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:2px}
.stat.s-ok   .val{color:var(--ok)}
.stat.s-miss .val{color:var(--miss)}
.stat.s-err  .val{color:var(--err)}

/* log */
.log-wrap{flex:1;overflow-y:auto;min-height:0}
.log-wrap::-webkit-scrollbar{width:4px}
.log-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.log-row{
  display:flex;align-items:center;gap:7px;
  padding:3px 14px;font-size:11px;
  border-bottom:1px solid transparent;
}
.log-row:hover{background:var(--surface)}
.log-row.row-ok   {border-left:2px solid var(--ok)}
.log-row.row-miss {border-left:2px solid var(--miss)}
.log-row.row-err  {border-left:2px solid var(--err)}
.ico-ok   {color:var(--ok);  flex-shrink:0;width:12px;text-align:center;font-size:11px}
.ico-miss {color:var(--miss);flex-shrink:0;width:12px;text-align:center;font-size:11px}
.ico-err  {color:var(--err); flex-shrink:0;width:12px;text-align:center;font-size:11px}
.cat{flex-shrink:0;font-size:9px;font-weight:700;text-transform:uppercase;
  padding:1px 5px;border-radius:3px;letter-spacing:.04em}
.cat-style    {background:rgba(24,160,251,.14);color:#18a0fb}
.cat-variable {background:rgba(255,204,0,.14); color:#f5c400}
.cat-component{background:rgba(242,72,34,.14); color:#f24822}
.log-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* stopped banner */
.stopped-row{
  padding:5px 14px;background:var(--miss-dim);
  border-top:1px solid rgba(245,166,35,.3);
  font-size:11px;color:var(--miss);text-align:center;
  flex-shrink:0;
}

/* footer */
.footer{padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:8px}
.btn{flex:1;padding:8px 12px;border-radius:var(--r);font-family:var(--font);
  font-size:12px;font-weight:600;cursor:pointer;border:none;transition:background .12s,opacity .12s}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:not(:disabled):hover{background:#0d90e8}
.btn-danger {background:var(--err);color:#fff}
.btn-danger:not(:disabled):hover{background:#d93d1e}
.btn-ghost  {background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.btn-ghost:not(:disabled):hover{background:#404040}

/* status bar */
.sbar{height:24px;padding:0 14px;display:flex;align-items:center;gap:6px;
  font-size:11px;border-top:1px solid var(--border);flex-shrink:0}
.sbar.hidden{display:none}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sbar.busy .sdot{background:var(--accent);animation:pulse .9s infinite}
.sbar.ok   .sdot{background:var(--ok)}
.sbar.warn .sdot{background:var(--miss)}
.sbar.err  .sdot{background:var(--err)}
.sbar.busy{color:var(--accent)}.sbar.ok{color:var(--ok)}.sbar.warn{color:var(--miss)}.sbar.err{color:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</head>
<body>

<div class="header"><h1>Relinker</h1></div>

<div class="sel">
  <div id="dot" class="dot"></div>
  <div style="overflow:hidden;flex:1">
    <div id="sel-name" class="sel-name" style="color:var(--muted)">Nothing selected</div>
    <div id="sel-sub"  class="sel-sub">Select a frame or component</div>
  </div>
</div>

<div class="body" id="body">
  <!-- idle / log shown here -->
</div>

<div class="footer">
  <button id="btn-stop"   class="btn btn-danger"  style="display:none">Stop</button>
  <button id="btn-relink" class="btn btn-primary"  disabled>Relink</button>
</div>

<div id="sbar" class="sbar hidden">
  <div class="sdot"></div><span id="sbar-txt"></span>
</div>

<script>
// ── state ─────────────────────────────────────
let hasSel    = false;
let running   = false;

// ── dedup sets (reset each run) ───────────────
let seenOk   = new Set();
let seenMiss = new Set();
let seenErr  = new Set();

// ── stats (live) ──────────────────────────────
let liveStats = { relinked:0, missing:0, errors:0, processed:0 };

// ── DOM ───────────────────────────────────────
const dot      = document.getElementById('dot');
const selName  = document.getElementById('sel-name');
const selSub   = document.getElementById('sel-sub');
const body     = document.getElementById('body');
const btnStop  = document.getElementById('btn-stop');
const btnRelink= document.getElementById('btn-relink');
const sbar     = document.getElementById('sbar');
const sbarTxt  = document.getElementById('sbar-txt');

// ── status bar ────────────────────────────────
function setStatus(type, txt){ sbar.className='sbar '+type; sbarTxt.textContent=txt; }
function clearStatus(){ sbar.className='sbar hidden'; }

// ── selection ─────────────────────────────────
function updateSel(info){
  hasSel = info.hasSelection;
  dot.className = 'dot'+(hasSel?' on':'');
  if(hasSel){
    selName.textContent = info.name; selName.style.color='';
    selSub.textContent  = info.nodeType;
  } else {
    selName.textContent='Nothing selected'; selName.style.color='var(--muted)';
    selSub.textContent ='Select a frame or component';
    showIdle();
  }
  if(!running) btnRelink.disabled = !hasSel;
}

// ── idle ──────────────────────────────────────
function showIdle(){
  body.innerHTML=`<div class="idle">
    <div class="ico">⇄</div>
    <div class="title">Relinker</div>
    <div class="desc">Select a frame pasted from a donor library and click <strong>Relink</strong>.<br><br>
    The plugin walks every node in the tree, including inside nested components, and relinks styles, variables and component instances to local equivalents in real time.</div>
  </div>`;
}

// ── build log shell (stats + empty log) ───────
function buildLogShell(){
  body.innerHTML=`
    <div class="stats" id="stats">
      <div class="stat" id="s-ok">  <div class="val" id="v-ok">0</div>  <div class="lbl">Relinked</div></div>
      <div class="stat" id="s-miss"><div class="val" id="v-miss">0</div><div class="lbl">Missing</div></div>
      <div class="stat" id="s-err"> <div class="val" id="v-err">0</div> <div class="lbl">Errors</div></div>
    </div>
    <div class="log-wrap" id="log-wrap"></div>`;
}

// ── update live stats ─────────────────────────
function updateStats(stats){
  liveStats = stats;
  const vOk   = document.getElementById('v-ok');
  const vMiss = document.getElementById('v-miss');
  const vErr  = document.getElementById('v-err');
  const sOk   = document.getElementById('s-ok');
  const sMiss = document.getElementById('s-miss');
  const sErr  = document.getElementById('s-err');
  if(!vOk) return;
  vOk.textContent   = stats.relinked;
  vMiss.textContent = stats.missing;
  vErr.textContent  = stats.errors;
  sOk.className   = 'stat'+(stats.relinked>0?' s-ok':'');
  sMiss.className = 'stat'+(stats.missing>0?' s-miss':'');
  sErr.className  = 'stat'+(stats.errors>0?' s-err':'');
  setStatus('busy',`Processing… ${stats.processed} nodes`);
}

// ── append log entries ────────────────────────
const ICON = { ok:'✓', missing:'✗', error:'!' };
const ICON_CLS = { ok:'ico-ok', missing:'ico-miss', error:'ico-err' };
const ROW_CLS  = { ok:'row-ok', missing:'row-miss', error:'row-err' };
const CAT_LBL  = { style:'STYLE', variable:'VAR', component:'COMP' };

function appendEntries(entries){
  const wrap = document.getElementById('log-wrap');
  if(!wrap) return;
  const frag = document.createDocumentFragment();
  for(const e of entries){
    // dedup per-status — show each unique name once per category
    const key = `${e.status}|${e.category}|${e.name}`;
    const seen = e.status==='ok' ? seenOk : e.status==='missing' ? seenMiss : seenErr;
    if(seen.has(key)) continue;
    seen.add(key);

    const row = document.createElement('div');
    row.className = `log-row ${ROW_CLS[e.status]}`;
    row.innerHTML = `<span class="${ICON_CLS[e.status]}">${ICON[e.status]}</span>
      <span class="cat cat-${e.category}">${CAT_LBL[e.category]}</span>
      <span class="log-name" title="${esc(e.name)}">${esc(e.name)}</span>`;
    frag.appendChild(row);
  }
  wrap.appendChild(frag);
  // auto-scroll to bottom
  wrap.scrollTop = wrap.scrollHeight;
}

// ── add stopped banner ────────────────────────
function addStoppedBanner(){
  const wrap = document.getElementById('log-wrap');
  if(!wrap) return;
  const banner = document.createElement('div');
  banner.className = 'stopped-row';
  banner.textContent = '⏹ Stopped by user — partial results above';
  wrap.appendChild(banner);
  wrap.scrollTop = wrap.scrollHeight;
}

// ── escape ────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── set running state ─────────────────────────
function setRunning(on){
  running = on;
  btnStop.style.display  = on ? '' : 'none';
  btnRelink.style.display= on ? 'none' : '';
  btnRelink.disabled = !hasSel;
}

// ── buttons ───────────────────────────────────
btnRelink.addEventListener('click',()=>{
  seenOk = new Set(); seenMiss = new Set(); seenErr = new Set();
  buildLogShell();
  setRunning(true);
  parent.postMessage({pluginMessage:{type:'relink-selection'}},'*');
});

btnStop.addEventListener('click',()=>{
  btnStop.disabled = true;
  btnStop.textContent = 'Stopping…';
  parent.postMessage({pluginMessage:{type:'stop-relink'}},'*');
});

// ── plugin messages ───────────────────────────
window.onmessage = e => {
  const msg = e.data.pluginMessage;
  if(!msg) return;
  switch(msg.type){

    case 'selection-info':
      updateSel(msg);
      if(!running) clearStatus();
      break;

    case 'relink-start':
      // shell already built on button click; nothing extra needed
      break;

    case 'relink-progress':
      appendEntries(msg.entries);
      updateStats(msg.stats);
      break;

    case 'relink-done': {
      const r = msg.result;
      updateStats(r.stats);
      if(r.stopped) addStoppedBanner();
      setRunning(false);
      const { relinked, missing, errors } = r.stats;
      if(errors>0)        setStatus('warn',`${relinked} relinked · ${errors} error${errors>1?'s':''} · ${missing} missing`);
      else if(missing>0)  setStatus('ok',  `${relinked} relinked · ${missing} missing locally`);
      else if(relinked>0) setStatus('ok',  `${relinked} ${relinked===1?'dependency':'dependencies'} relinked ✓`);
      else                setStatus('ok',  'Nothing to relink — all already local');
      break;
    }

    case 'error':
      setRunning(false);
      setStatus('err', msg.message);
      break;
  }
};

// ── boot ──────────────────────────────────────
showIdle();
parent.postMessage({pluginMessage:{type:'get-selection-info'}},'*');
</script>
</body>
</html>
